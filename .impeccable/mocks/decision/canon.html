<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#F2F2F7;color:#111;font:20px/1.35 -apple-system,"SF Pro Text",Roboto,system-ui,sans-serif}
header{padding:60px 20px 8px}
h1{font-size:38px;font-weight:700;letter-spacing:-.01em}
.sub{color:#555;font-size:18px;margin-top:4px}
.group{margin:22px 16px 0;background:#fff;border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:16px;border-bottom:1px solid #E3E3E8}
.row:last-child{border-bottom:none}
.ic{width:36px;height:36px;border-radius:9px;background:#0A60D0;flex:none}
.ic.g{background:#2E7D32}.ic.o{background:#C15F00}
.row b{font-weight:600;display:block}
.row span{font-size:16px;color:#555}
.chev{margin-left:auto;color:#999;font-size:22px}
.cap{margin:22px 32px 0;color:#555;font-size:15px;text-transform:uppercase;letter-spacing:.02em}
.btn{margin:22px 16px 0;background:#0A60D0;color:#fff;text-align:center;font-weight:600;padding:17px;border-radius:14px}
.tabs{position:absolute;bottom:0;left:0;right:0;height:88px;background:rgba(249,249,249,.95);border-top:1px solid #D8D8DC;display:flex;justify-content:space-around;padding-top:10px;font-size:14px;font-weight:600}
.tabs span{display:flex;flex-direction:column;align-items:center;gap:4px;color:#777}
.tabs span i{width:26px;height:26px;border-radius:6px;background:#A5A5AA}
.tabs .on{color:#0A60D0}.tabs .on i{background:#0A60D0}
</style></head><body>
<header><h1>Porch Watch</h1><p class="sub">Know the signs before they reach your door.</p></header>
<div class="btn">Check a message</div>
<div class="cap">More</div>
<div class="group">
<div class="row"><div class="ic g"></div><div><b>Spot the Scam</b><span>Practice with 5 messages</span></div><span class="chev">›</span></div>
<div class="row"><div class="ic o"></div><div><b>AI Scams</b><span>What's changed lately</span></div><span class="chev">›</span></div>
</div>
<div class="cap">Remember</div>
<div class="group"><div class="row"><div><span style="color:#111;font-size:18px">Real banks and family never ask for gift cards, wire transfers, or crypto.</span></div></div></div>
<nav class="tabs"><span class="on"><i></i>Home</span><span><i></i>Check</span><span><i></i>Quiz</span><span><i></i>Learn</span></nav>
</body></html>
