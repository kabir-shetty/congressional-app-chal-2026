<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#fff;color:#111;font:20px/1.4 -apple-system,"SF Pro Text",Roboto,system-ui,sans-serif}
header{padding:60px 20px 14px;border-bottom:4px solid #C2410C}
header h1{font-size:34px;font-weight:800;letter-spacing:-.01em}
header p{font-size:17px;color:#57534E;margin-top:2px}
main{padding:20px;display:flex;flex-direction:column;gap:20px}
.btn{background:#C2410C;color:#fff;font-weight:700;text-align:center;padding:17px;border-radius:12px;font-size:21px}
.label{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#57534E}
.result{border:1px solid #E7E5E4;border-radius:14px;padding:16px}
.result q{display:block;font-size:17px;color:#44403C;margin:6px 0 14px}
.scale{display:flex;justify-content:space-between;align-items:center}
.scale i{width:44px;height:44px;border-radius:22px;border:3px solid #D6D3D1}
.scale i.f1{background:#15803D;border-color:#15803D;opacity:.25}
.scale i.f2{background:#65A30D;border-color:#65A30D;opacity:.25}
.scale i.f3{background:#A8A29E;border-color:#A8A29E;opacity:.25}
.scale i.f4{background:#EA580C;border-color:#EA580C;opacity:.25}
.scale i.f5{background:#B91C1C;border-color:#B91C1C;box-shadow:0 0 0 4px #fff,0 0 0 6px #B91C1C}
.ends{display:flex;justify-content:space-between;font-size:15px;color:#57534E;margin-top:6px}
.verdict{font-size:24px;font-weight:800;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:18px}
td{padding:12px 0;border-top:1px solid #E7E5E4}
td:last-child{text-align:right;color:#57534E}
.tabs{position:absolute;bottom:0;left:0;right:0;height:88px;background:#fff;border-top:1px solid #E7E5E4;display:flex;justify-content:space-around;padding-top:10px;font-size:14px;font-weight:600}
.tabs span{display:flex;flex-direction:column;align-items:center;gap:4px;color:#78716C}
.tabs span i{width:26px;height:26px;border-radius:6px;background:#A8A29E}
.tabs .on{color:#C2410C}.tabs .on i{background:#C2410C}
</style></head><body>
<header><h1>Porch Watch</h1><p>Know the signs before they reach your door.</p></header>
<main>
<div class="btn">Check a message</div>
<section class="result"><div class="label">Your last check · Oct 18</div><q>"USPS: your package is held. Pay $1.99 to release it…"</q>
<div class="scale"><i class="f1"></i><i class="f2"></i><i class="f3"></i><i class="f4"></i><i class="f5"></i></div>
<div class="ends"><span>Looks safe</span><span>Scam</span></div>
<div class="verdict">Very likely a scam</div></section>
<table><tr><td>Spot the Scam</td><td>2 of 5 ›</td></tr><tr><td>How AI scams work</td><td>4 topics ›</td></tr></table>
</main>
<nav class="tabs"><span class="on"><i></i>Home</span><span><i></i>Check</span><span><i></i>Practice</span><span><i></i>Learn</span></nav>
</body></html>
