<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#F5F5F2;color:#1C1C1C;font:20px/1.4 -apple-system,"SF Pro Text",Roboto,system-ui,sans-serif}
.guide{background:#0B5D3B;color:#fff;margin:0;padding:60px 20px 20px;border-bottom:6px solid #fff;box-shadow:0 6px 0 #0B5D3B}
.guide h1{font:900 40px/1 "Overpass";letter-spacing:.01em}
.guide p{font:700 18px/1.3 "Overpass";margin-top:8px;opacity:.95}
main{padding:28px 20px;display:flex;flex-direction:column;gap:18px}
.sign{border-radius:14px;padding:18px;border:4px solid #fff;outline:3px solid currentColor}
.go{background:#0B5D3B;color:#fff;outline-color:#0B5D3B}
.go .row{display:flex;justify-content:space-between;align-items:center}
.go h2{font:800 26px/1.1 "Overpass"}
.arrow{font:900 34px "Overpass"}
.go p{font-size:17px;margin-top:6px;opacity:.95}
.caution{background:#F2B705;color:#1C1C1C;outline-color:#1C1C1C;display:flex;gap:14px;align-items:center}
.diamond{width:54px;height:54px;flex:none;background:#F2B705;border:3px solid #1C1C1C;transform:rotate(45deg);display:flex;align-items:center;justify-content:center}
.diamond b{transform:rotate(-45deg);font:900 26px "Overpass"}
.caution h3{font:800 20px/1.15 "Overpass";text-transform:uppercase}
.caution p{font-size:16px}
.miles{display:flex;gap:10px;align-items:flex-end}
.mile{width:44px;background:#0B5D3B;color:#fff;border:3px solid #fff;outline:2px solid #0B5D3B;border-radius:6px;text-align:center;font:800 18px/1 "Overpass";padding:8px 0}
.mile.off{background:#fff;color:#0B5D3B}
.label{font:800 15px "Overpass";letter-spacing:.08em;text-transform:uppercase;color:#555}
.tabs{position:absolute;bottom:0;left:0;right:0;height:88px;background:#fff;border-top:1px solid #CFCFC8;display:flex;justify-content:space-around;padding-top:10px;font-size:14px;font-weight:600}
.tabs span{display:flex;flex-direction:column;align-items:center;gap:4px;color:#555}
.tabs span i{width:26px;height:26px;border-radius:6px;background:#9A9A94}
.tabs .on{color:#0B5D3B}.tabs .on i{background:#0B5D3B}
</style></head><body>
<header class="guide"><h1>PORCH WATCH</h1><p>Know the signs before they reach your door</p></header>
<main>
<section class="sign go"><div class="row"><h2>Check a message</h2><span class="arrow">→</span></div><p>Paste text or add a screenshot for a plain answer.</p></section>
<div class="label">Practice · Spot the Scam</div>
<div class="miles"><div class="mile">1</div><div class="mile">2</div><div class="mile off">3</div><div class="mile off">4</div><div class="mile off">5</div></div>
<section class="sign caution"><div class="diamond"><b>!</b></div><div><h3>Slow down for</h3><p>Gift cards, wire transfers, crypto, and "keep this secret."</p></div></section>
</main>
<nav class="tabs"><span class="on"><i></i>Home</span><span><i></i>Check</span><span><i></i>Practice</span><span><i></i>Learn</span></nav>
</body></html>
