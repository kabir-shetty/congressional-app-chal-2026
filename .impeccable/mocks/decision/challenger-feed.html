<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#0E0E10;color:#fff;font:20px/1.4 -apple-system,"SF Pro Text",Roboto,system-ui,sans-serif;position:relative}
.top{position:absolute;top:56px;left:20px;right:20px;display:flex;justify-content:space-between;font-size:16px;font-weight:700}
.prog{display:flex;gap:4px;position:absolute;top:86px;left:20px;right:20px}
.prog i{flex:1;height:4px;background:rgba(255,255,255,.3);border-radius:2px}
.prog i.on{background:#fff}
.msg{position:absolute;top:150px;left:20px;right:96px;background:#26262B;border-radius:18px;padding:18px}
.msg small{color:#A1A1AA;font-size:15px}
.msg p{font-size:22px;margin-top:6px}
.rail{position:absolute;right:14px;top:330px;display:flex;flex-direction:column;gap:18px;align-items:center}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;font-weight:700;text-align:center;width:72px}
.act i{width:60px;height:60px;border-radius:30px;display:block}
.scam i{background:#E5484D}.safe i{background:#3FB950}.unsure i{background:#3A3A40}
.cap{position:absolute;left:20px;right:100px;bottom:110px}
.cap b{font-size:16px;color:#F2C94C;letter-spacing:.06em}
.cap p{font-size:18px;color:#E4E4E7;margin-top:4px}
.scrim{position:absolute;left:0;right:0;bottom:88px;height:220px;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.tabs{position:absolute;bottom:0;left:0;right:0;height:88px;background:#0E0E10;border-top:1px solid #2A2A2F;display:flex;justify-content:space-around;padding-top:10px;font-size:14px;font-weight:600}
.tabs span{display:flex;flex-direction:column;align-items:center;gap:4px;color:#8A8A93}
.tabs span i{width:26px;height:26px;border-radius:6px;background:#4A4A52}
.tabs .on{color:#fff}.tabs .on i{background:#fff}
</style></head><body>
<div class="top"><span>Spot the Scam</span><span>3 of 5</span></div>
<div class="prog"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></div>
<div class="msg"><small>Text message · 10:42 AM</small><p>Grandma it's me, I'm in trouble and need $900 in gift cards. Please don't tell Mom.</p></div>
<div class="scrim"></div>
<div class="rail"><div class="act scam"><i></i>It's a Scam</div><div class="act safe"><i></i>Not a Scam</div></div>
<div class="cap"><b>YOUR CALL</b><p>Read it slowly. What would you do?</p></div>
<nav class="tabs"><span><i></i>Home</span><span><i></i>Check</span><span class="on"><i></i>Practice</span><span><i></i>Learn</span></nav>
</body></html>
